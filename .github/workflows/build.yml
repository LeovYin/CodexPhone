name: Build Android and Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: CodexPhone-android-unsigned-ci
          path: apps/android/app/build/outputs/apk/release/*unsigned.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node tests/bridge-ownership.mjs
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm release:build
      - run: pnpm release:test
      - uses: actions/upload-artifact@v7
        with:
          name: CodexPhone-win-x64
          path: releases/[0-9]*/*
