name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node tests/bridge-ownership.mjs
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm release:build
      - run: pnpm release:test
      - uses: actions/upload-artifact@v7
        with:
          name: CodexPhone-win-x64
          path: releases/[0-9]*/*
